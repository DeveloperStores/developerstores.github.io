<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global IQ System - Analytics Panel</title>
    
    <!-- Telegram Engine Injection -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag SDK Verification Module -->
    <script src='//libtl.com/sdk.js' data-zone='11130864' data-sdk='show_11130864'></script>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a14, #121225);
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 35px 25px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        h1 { color: #64b5f6; font-size: 28px; margin-top: 0; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #9fa0c3; font-size: 15px; line-height: 1.6; }
        .score-display {
            font-size: 64px;
            font-weight: 900;
            color: #00ffcc;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(0,255,204,0.35);
            letter-spacing: -1px;
        }
        .status-badge {
            font-size: 15px;
            color: #ffd54f;
            font-weight: 600;
            background: rgba(255, 213, 79, 0.08);
            padding: 12px 18px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 213, 79, 0.15);
        }
        .btn-action {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 16px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 65, 108, 0.35);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 100%;
            margin-top: 15px;
        }
        .btn-action:active { transform: scale(0.96); opacity: 0.9; }
        .log-box { margin-top: 15px; color: #ff5252; font-size: 13px; font-weight: 500; min-height: 20px;}
        hr { border: 0; border-top: 1px solid rgba(255,255,255,0.06); margin: 30px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="ui-title">IQ Analytics</h1>
        <p id="ui-desc">Processing matrix verification...</p>
        
        <div class="score-display" id="ui-iq">---</div>
        <div class="status-badge" id="ui-status">Calculating metrics...</div>

        <hr>

        <h4 style="margin: 0 0 10px 0; color: #e1bee7; font-size: 16px;" id="ui-reward-title">Unlock Certificate</h4>
        <p style="font-size: 13px;" id="ui-reward-desc">Watch a premium verification video stream to secure your certification token instantly.</p>
        
        <button class="btn-action" onclick="runPremiumAdPipeline()" id="ui-btn">📺 Watch Ad & Claim</button>
        <div id="ui-log" class="log-box"></div>
    </div>

    <script>
        const tgApp = window.Telegram.WebApp;
        tgApp.ready();
        tgApp.expand();

        // Get variables from query parameters
        const params = new URLSearchParams(window.location.search);
        const userScore = parseInt(params.get('score')) || 0;
        const userLang = params.get('lang') === 'hi' ? 'hi' : 'en';

        // IQ Algorithm
        let iqScore = 80 + (userScore * 15);
        if (iqScore > 140) iqScore = 140;

        document.getElementById('ui-iq').innerText = "IQ: " + iqScore;

        // Internationalization localization configurations dictionary
        const uiStrings = {
            en: {
                title: "🧠 Global IQ Result",
                desc: "Your cognitive assessment response profiles have been thoroughly analyzed.",
                rewardTitle: "🎁 Unlock Premium Certificate",
                rewardDesc: "Watch a short digital video ad to securely generate your verified Einstein-tier certificate badge.",
                btn: "📺 Watch Ad & Get Reward",
                loading: "Establishing secure ad connection stream...",
                success: "🎉 Checked! Digital verification packet dispatched to bot interface.",
                fail: "Network timeout or closed too early. Please try again.",
                statusGenius: "⚡ Exceptional Genius Intelligence!",
                statusHigh: "🚀 Highly Capable Rational Analytics",
                statusNormal: "🧠 Balanced Cognitive Baseline Metric"
            },
            hi: {
                title: "🧠 Global IQ Result",
                desc: "Aapke dimaagi performance matrix ka analysis complete ho chuka hai.",
                rewardTitle: "🎁 Premium Certificate Unlock Karein",
                rewardDesc: "Ek choti video ad dekhein aur bina kisi verification fees ke apna official genius level certificate paayein.",
                btn: "📺 Video Dekhein & Reward Paayein",
                loading: "Ad verification server se connect ho raha hai...",
                success: "🎉 Checked! Verification successful. Data bot ko bhej diya gaya hai.",
                fail: "Ad load nahi ho saki ya jaldi band ho gayi. Kripya fir se click karein.",
                statusGenius: "⚡ Alag hi Level ka Tezz Dimaag!",
                statusHigh: "🚀 Shandaar Logical Analytics Power",
                statusNormal: "🧠 Normal balanced human mind metrics"
            }
        };

        const currentUI = uiStrings[userLang];

        // Apply dynamic translation text rendering
        document.getElementById('ui-title').innerText = currentUI.title;
        document.getElementById('ui-desc').innerText = currentUI.desc;
        document.getElementById('ui-reward-title').innerText = currentUI.rewardTitle;
        document.getElementById('ui-reward-desc').innerText = currentUI.rewardDesc;
        document.getElementById('ui-btn').innerText = currentUI.btn;

        // Status configuration execution mapping
        if (iqScore >= 125) {
            document.getElementById('ui-status').innerText = currentUI.statusGenius;
        } else if (iqScore >= 110) {
            document.getElementById('ui-status').innerText = currentUI.statusHigh;
        } else {
            document.getElementById('ui-status').innerText = currentUI.statusNormal;
        }

        // 1. In-App Interstitial Configuration Run Configuration (Automatic Ads Engine)
        show_11130864({
          type: 'inApp',
          inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
          }
        });

        // 2. Interactive Programmatic Event Loop for Manual Monetag Action 
        function runPremiumAdPipeline() {
            document.getElementById('ui-log').style.color = "#ffd54f";
            document.getElementById('ui-log').innerText = currentUI.loading;
            
            show_11130864().then(() => {
                // Triggered instantly if reward confirmation validated
                document.getElementById('ui-log').style.color = "#00ffcc";
                document.getElementById('ui-log').innerText = currentUI.success;
                
                setTimeout(() => {
                    tgApp.sendData("reward_unlocked");
                    tgApp.close();
                }, 1600);

            }).catch((e) => {
                document.getElementById('ui-log').style.color = "#ff5252";
                document.getElementById('ui-log').innerText = currentUI.fail;
            });
        }
    </script>
</body>
</html>
